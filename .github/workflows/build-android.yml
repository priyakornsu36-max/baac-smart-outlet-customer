name: Build BAAC OUTLET Android

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'icon-192.png'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare launcher icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable
          cp icon-192.png android-app/app/src/main/res/drawable/baac_icon.png

      - name: Build Android APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish Android APK to site
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk BAAC-OUTLET-Android.apk
          git config user.name "baac-smart-outlet"
          git config user.email "priyakorn.su36@gmail.com"
          git add -f BAAC-OUTLET-Android.apk
          git diff --cached --quiet || git commit -m "Publish BAAC OUTLET Android app"
          git pull --rebase origin main
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: BAAC-OUTLET-Android
          path: BAAC-OUTLET-Android.apk
          if-no-files-found: error
          retention-days: 30
