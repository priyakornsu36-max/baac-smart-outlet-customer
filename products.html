<!DOCTYPE html>
<html lang="th">

<head>
  <meta name="theme-color" content="#0d5632">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BAAC OUTLET">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="app.js?v=8"></script>


  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <link rel="stylesheet" href="products-style-1.css?v=8">
<link rel="stylesheet" href="products-style-2.css?v=8">


<link rel="stylesheet" href="products-style-3.css?v=8">


<link rel="stylesheet" href="products-style-4.css?v=8">


<link rel="stylesheet" href="products-style-5.css?v=8">


<link rel="stylesheet" href="products-style-6.css?v=8">

  <link rel="stylesheet" href="customer-font.css?v=8">
</head>


<body>


<div class="page">


  <header class="shop-header">


    <div class="shop-header-inner">


      <div class="top-row">


        <button
          class="back-button"
          onclick="goBackMember()"
        >

          <span class="back-arrow">
            ←
          </span>

          <span>
            กลับ
          </span>

        </button>



        <div class="brand-area">

          <div class="brand">
            BAAC SMART OUTLET
          </div>

          <div class="brand-subtitle">
            ระบบบริหารร้านฝากขายอัจฉริยะ
          </div>

        </div>


        <div></div>


      </div>

    </div>



    <div class="shop-roof">

      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>
      <div class="awning"></div>

    </div>


  </header>



  <main class="container">


    <section class="search-section">

<div
        id="categoryFilterRow"
        class="filter-row"
      >


        <button
          class="filter-button active"
          data-category="ทั้งหมด"
          onclick="selectCategory(this)"
        >
          ทั้งหมด
        </button>


      </div>


    </section>



    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      กำลังโหลดสินค้า...

    </div>



    <div
      id="content"
      style="display:none;"
    >


      <!-- BEST SELLER -->


      <section class="best-section">


        <div class="best-header">


          <div class="best-heading-wrap">


            <div class="best-heading-icon">

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <path
                  d="M7 4H17V8C17 11.3 14.8 14 12 14C9.2 14 7 11.3 7 8V4Z"
                  stroke="#118149"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />

                <path
                  d="M7 6H4V8C4 10.2 5.8 12 8 12"
                  stroke="#118149"
                  stroke-width="1.8"
                />

                <path
                  d="M17 6H20V8C20 10.2 18.2 12 16 12"
                  stroke="#118149"
                  stroke-width="1.8"
                />

                <path
                  d="M12 14V18"
                  stroke="#118149"
                  stroke-width="1.8"
                />

                <path
                  d="M8 20H16"
                  stroke="#118149"
                  stroke-width="1.8"
                />

              </svg>

            </div>



            <div>

              <div class="best-title">
                สินค้าขายดี
              </div>

              <div class="best-subtitle">
                3 อันดับสินค้าที่มียอดขายสูงสุด
              </div>

            </div>


          </div>


        </div>



        <div
          class="best-grid"
          id="bestSellerGrid"
        ></div>


      </section>



      <!-- PRODUCT LIST -->


      <div class="list-row">


        <div class="section-title">
          สินค้าที่มีจำหน่าย
        </div>


        <div
          class="product-count"
          id="productCount"
        >
          0 รายการ
        </div>


      </div>



      <div
        class="product-grid"
        id="productGrid"
      ></div>



      <div
        class="empty"
        id="emptyState"
      >

        <div class="empty-title">
          ไม่พบสินค้า
        </div>

        <div class="empty-text">
          ลองเปลี่ยนคำค้นหาหรือประเภทสินค้า
        </div>

      </div>


    </div>



    <div
      class="empty"
      id="errorState"
    >

      <div class="empty-title">
        ไม่สามารถโหลดข้อมูลได้
      </div>

      <div
        class="empty-text"
        id="errorMessage"
      ></div>

    </div>



    <div class="footer">
      BAAC SMART OUTLET
    </div>


  </main>


</div>



<script src="products-script-1.js?v=8"></script>


</body>

</html>
