<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="theme-color" content="#0d5632">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BAAC SMART OUTLET">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="app.js?v=15"></script>

  <base target="_top">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BAAC SMART OUTLET - ผู้ฝากขาย</title>

  <link rel="stylesheet" href="consignor-style-1.css?v=12">
<link rel="stylesheet" href="consignor-style-2.css?v=12">
<link rel="stylesheet" href="consignor-style-3.css?v=12">

<link rel="stylesheet" href="consignor-style-4.css?v=12">


<link rel="stylesheet" href="consignor-style-5.css?v=12">


<link rel="stylesheet" href="consignor-style-6.css?v=12">


<link rel="stylesheet" href="consignor-style-7.css?v=12">


<link rel="stylesheet" href="consignor-style-8.css?v=12">


<link rel="stylesheet" href="consignor-style-9.css?v=12">


<link rel="stylesheet" href="consignor-style-10.css?v=14">

  <link rel="stylesheet" href="customer-font.css?v=12">
</head>


<body>


<!-- ========================================================
     HERO
======================================================== -->

<section class="hero">

  <div class="hero-inner">

    <div class="nav">

      <div class="brand">

        <div>

          <div class="brand-title">
            BAAC SMART OUTLET
          </div>

          <div class="brand-sub">
            สำหรับผู้ฝากขาย
          </div>

        </div>

      </div>


      <button
        class="logout"
        onclick="logoutConsignor()"
      >
        ออกจากระบบ
      </button>

    </div>

  </div>

</section>


<!-- ========================================================
     MAIN
======================================================== -->

<main
  class="main"
  id="app"
>

  <div class="loading">
    กำลังโหลดข้อมูล...
  </div>

</main>

<div
  id="paymentNotification"
  class="payment-notification"
  onclick="openPaymentNotification()"
>
  <div
    id="paymentNotificationText"
    class="payment-notification-text"
  ></div>

  <button
    type="button"
    class="payment-notification-close"
    onclick="dismissPaymentNotification(event)"
    aria-label="ปิด"
  >
    ×
  </button>
</div>


<!-- ========================================================
     MODAL
======================================================== -->

<div
  class="modal"
  id="detailModal"
>

  <div class="modal-box">

    <div class="modal-head">

      <div
        class="modal-title"
        id="modalTitle"
      ></div>

      <button
        class="modal-close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div
      class="modal-content"
      id="modalContent"
    ></div>

  </div>

</div>



<!-- ========================================================
     IMAGE LIGHTBOX
======================================================== -->

<div
  class="image-lightbox"
  id="imageLightbox"
  aria-hidden="true"
>

  <button
    type="button"
    class="image-lightbox-close"
    onclick="closeProofLightbox()"
    aria-label="ปิด"
  >
    ×
  </button>


  <div
    class="image-lightbox-stage"
    id="imageLightboxStage"
  >

    <img
      class="image-lightbox-img"
      id="imageLightboxImg"
      alt="หลักฐานการโอนเงิน"
    >

  </div>

</div>



<script src="consignor-script-1.js?v=19"></script>
<script src="consignor-script-2.js?v=16"></script>

</body>
</html>
